; photo_mode controls - edit by hand. One "action=key" per line; ";" starts a comment.
; A copy in Saves\Mods\photo_mode.controls.ini next to RcCarsRe.exe wins over this file (it survives mod updates);
; only the lines it has replace these.
; Changes are read when the mod loads, on Apply in the Mods screen, on the -dev hot reload, and each time the photo
; mode is switched on.
;
; Keyboard and mouse names: A .. Z, 0 .. 9, F1 .. F12, Ctrl, Shift, Alt, Space, Tab, Enter, Esc, Backspace,
;   Up, Down, Left, Right, PageUp, PageDown, Home, End, Insert, Delete, Plus, Minus, Comma, Period,
;   MouseLeft, MouseRight, MouseMiddle, WheelUp, WheelDown, None (no key).
; Pad button names (DS4 / DualSense / Xbox): a (cross), b (circle), x (square), y (triangle), lb (l1), rb (r1),
;   back (view / share / create / select), start (options), ls (l3), rs (r3), touchpad, up, down, left, right
;   (the D-pad), None.
; An unknown name gives a yellow warning in the log / -dev console and the default stays for that action.
; Moving, looking and the triggers (up / down) on the pad always use the sticks and the triggers; their dead
; zones are the two numbers at the end.

[Keyboard]
toggle=P            ; photo mode on / off
leave=Esc           ; leave the photo mode
forward=W           ; fly forward, where the camera looks (up and down too)
back=S              ; fly back
left=A              ; move left (level, roll does not turn it)
right=D             ; move right
up=Shift            ; move up
down=Ctrl           ; move down
rollLeft=Q          ; roll left
rollRight=E         ; roll right
fast=Space          ; hold: four times faster
fovIn=WheelUp       ; zoom in (smaller field of view)
fovOut=WheelDown    ; zoom out
photo=F12           ; take a photo (saved in Screenshots, without the help line)

[Pad]
toggle=back         ; photo mode on / off (Back / View, Share, Create)
photo=a             ; take a photo
fast=ls             ; hold: four times faster
rollLeft=lb         ; roll left
rollRight=rb        ; roll right
fovIn=up            ; zoom in
fovOut=down         ; zoom out
leave=None          ; (toggle leaves too)
deadzone=0.2        ; the sticks' dead zone 0 .. 0.9 (raise it if the camera creeps by itself)
triggerDeadzone=0.1 ; the triggers' dead zone 0 .. 0.9
